<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>米其林散步指南 — 吉隆坡街頭小吃・六大區域</title>
<meta name="description" content="吉隆坡米其林指南必比登推介全攻略：六大區域、26 家必比登街頭小吃＋4 家老店情懷，每區手繪地圖、Google Maps 連結與推薦餐點。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Noto+Serif+TC:wght@400;600;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f1e5;
  --paper-2:#efe7d6;
  --ink:#1d1a16;
  --ink-soft:#57503f;
  --red:#a81e22;
  --red-deep:#7e1417;
  --gold:#b08d3e;
  --gold-ink:#8a6d2f;
  --gold-lt:#d9c08a;
  --leaf:#33684a;
  --rule:#d9cfb8;
  --serif-zh:"Noto Serif TC", serif;
  --sans-zh:"Noto Sans TC", sans-serif;
  --display:"Rozha One", "Noto Serif TC", serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans-zh);
  font-size:16px;
  line-height:1.8;
  border-top:4px solid var(--red);
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--red);color:var(--paper)}

/* ---------- nav ---------- */
nav{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:1rem;
  padding:.75rem clamp(1rem,4vw,3rem);
  background:var(--paper);
  border-bottom:1px solid var(--ink);
}
nav .brand{
  font-family:var(--display);color:var(--red);
  font-size:1.05rem;letter-spacing:.05em;white-space:nowrap;
}
nav .brand .zh{
  font-family:var(--serif-zh);font-weight:900;color:var(--ink);
  margin-left:.4em;letter-spacing:.1em;
}
nav .links{margin-left:auto;display:flex;gap:1.15rem;flex-wrap:wrap}
nav .links a{
  color:var(--ink);text-decoration:none;font-size:.8rem;letter-spacing:.06em;
  padding:.15rem 0;border-bottom:2px solid transparent;transition:.2s;
}
nav .links a:hover{color:var(--red);border-bottom-color:var(--red)}

/* ---------- hero: guide title page ---------- */
.hero{padding:clamp(2.5rem,6vh,4.5rem) clamp(1rem,4vw,3rem)}
.hero-frame{
  max-width:1080px;margin:0 auto;text-align:center;
  border:1px solid var(--red);outline:1px solid var(--red);outline-offset:5px;
  padding:clamp(2.6rem,6vh,4.5rem) clamp(1.2rem,4vw,3.5rem);
}
.hero-frame>*{opacity:0;transform:translateY(10px);animation:heroIn .7s ease forwards}
.hero-frame>:nth-child(1){animation-delay:.05s}
.hero-frame>:nth-child(2){animation-delay:.16s}
.hero-frame>:nth-child(3){animation-delay:.27s}
.hero-frame>:nth-child(4){animation-delay:.38s}
@keyframes heroIn{to{opacity:1;transform:none}}
.kicker{
  display:flex;align-items:center;justify-content:center;gap:1.1rem;
  font-family:var(--serif-zh);font-weight:600;font-size:.82rem;
  letter-spacing:.22em;color:var(--red);
}
.kicker::before,.kicker::after{content:"";height:1px;width:min(110px,16vw);background:var(--red)}
.hero h1{
  font-family:var(--serif-zh);font-weight:900;
  font-size:clamp(2.2rem,6vw,4.1rem);line-height:1.24;letter-spacing:.06em;
  margin:1.7rem auto 0;max-width:15em;
}
.hero h1 em{font-style:normal;color:var(--red)}
.hero .sub{
  margin:1.5rem auto 0;max-width:40em;color:var(--ink-soft);
  font-size:clamp(.92rem,1.5vw,1.02rem);
}
.hero .stats{display:flex;justify-content:center;flex-wrap:wrap;margin-top:2.3rem}
.hero .stats span{
  display:flex;align-items:baseline;gap:.5rem;
  padding:.25rem 1.5rem;border-left:1px solid var(--rule);
}
.hero .stats span:first-child{border-left:0}
.hero .stats b{font-family:var(--display);font-weight:400;color:var(--red);font-size:1.75rem;line-height:1}

/* ---------- dish index strip ---------- */
.dish-strip{
  background:var(--red);color:#f6f1e5;
  border-top:1px solid var(--red-deep);border-bottom:1px solid var(--red-deep);
}
.dish-strip .wrap{
  display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;
  column-gap:.9rem;row-gap:.25rem;
  padding:.85rem clamp(1rem,4vw,3rem);
}
.dish-strip .lbl{
  font-family:var(--serif-zh);font-weight:700;font-size:.8rem;
  letter-spacing:.3em;margin-right:.5rem;
}
.dish-strip .item{font-size:.8rem;letter-spacing:.08em;color:#f3e6d6}
.dish-strip .item::after{content:"·";margin-left:.9rem;color:rgba(246,241,229,.5)}
.dish-strip .item:last-child::after{content:""}

/* ---------- section frame ---------- */
section{padding:clamp(3rem,8vh,5.5rem) clamp(1rem,4vw,3rem)}
.wrap{max-width:1180px;margin:0 auto}
.sec-head{
  display:flex;align-items:baseline;gap:1.2rem;flex-wrap:wrap;
  border-top:2px solid var(--ink);padding-top:1.1rem;margin-bottom:2.2rem;
}
.sec-num{font-family:var(--display);color:var(--red);font-size:.95rem;letter-spacing:.2em}
.sec-title{
  font-family:var(--serif-zh);font-weight:900;
  font-size:clamp(1.5rem,3.2vw,2.1rem);letter-spacing:.05em;
}
.sec-title small{
  display:block;font-family:var(--display);font-weight:400;
  font-size:.85rem;color:var(--ink-soft);letter-spacing:.14em;margin-top:.3rem;
}
.sec-head.sub{margin-top:3rem}
.sec-head.sub .sec-title{font-size:clamp(1.15rem,2.2vw,1.5rem)}

/* ---------- table of contents ---------- */
.toc{border-bottom:1px solid var(--ink)}
.zone-row{
  display:grid;grid-template-columns:auto 1fr auto;align-items:baseline;gap:1.2rem;
  padding:1.1rem .5rem;border-top:1px solid var(--ink);
  text-decoration:none;color:var(--ink);transition:background .2s;
}
.zone-row:hover{background:var(--paper-2)}
.zone-row .zn{
  font-family:var(--display);color:var(--red);
  font-size:1.15rem;letter-spacing:.06em;min-width:3ch;
}
.zone-row .zt{display:flex;flex-direction:column;gap:.15rem;min-width:0}
.zone-row h3{font-family:var(--serif-zh);font-weight:900;font-size:1.12rem;letter-spacing:.04em}
.zone-row .zen{font-family:var(--display);font-size:.78rem;color:var(--ink-soft);letter-spacing:.12em}
.zone-row .brief{font-size:.78rem;color:var(--ink-soft)}
.zone-row .count{white-space:nowrap;font-size:.78rem;color:var(--ink-soft)}
.zone-row .count b{font-family:var(--display);font-weight:400;color:var(--red);font-size:1.15rem;margin-right:.2em}
.zone-row .count i{font-style:normal;color:var(--red);display:inline-block;margin-left:.45rem;transition:transform .2s}
.zone-row:hover .count i{transform:translateX(4px)}
.zone-note{margin-top:1.4rem;color:var(--ink-soft);font-size:.85rem;max-width:46em}

/* ---------- zone sections ---------- */
.zone-sec{background:var(--paper)}
.zone-sec.alt{background:var(--paper-2)}
.zone-head{
  display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap;
  border-top:2px solid var(--ink);padding-top:1.1rem;margin-bottom:1.6rem;
}
.zone-head .sec-num{font-size:1.3rem}
.zone-head h2{
  font-family:var(--serif-zh);font-weight:900;
  font-size:clamp(1.4rem,2.8vw,1.9rem);letter-spacing:.05em;
}
.zone-head h2 small{
  display:block;font-family:var(--display);font-weight:400;
  font-size:.82rem;color:var(--ink-soft);letter-spacing:.12em;margin-top:.25rem;
}
.zone-chip{
  font-size:.75rem;letter-spacing:.06em;border:1px solid var(--ink);
  padding:.4rem .9rem;color:var(--ink);white-space:nowrap;
}

/* ---------- printed map ---------- */
.map-box{border:1px solid var(--ink);background:var(--paper);margin-bottom:2rem}
.map-box svg{display:block;width:100%;height:auto}
.map-legend{
  display:flex;gap:1.4rem;flex-wrap:wrap;padding:.75rem 1.2rem;
  border-top:1px solid var(--ink);font-size:.78rem;color:var(--ink-soft);
}
.map-legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:.45rem;vertical-align:-1px}

/* ---------- guide entry cards ---------- */
.stop{
  position:relative;
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);
  border:1px solid var(--ink);background:var(--paper);margin-bottom:1.6rem;
}
.stop .left{
  position:relative;
  background:var(--paper-2);border-right:1px solid var(--ink);
  padding:1.8rem 1.5rem;display:flex;flex-direction:column;gap:.7rem;
}
.stop .idx{font-family:var(--display);color:var(--red);font-size:2.6rem;line-height:1}
.stop .zh{font-family:var(--serif-zh);font-weight:900;font-size:1.55rem;letter-spacing:.06em}
.stop .en{font-family:var(--display);font-size:.9rem;color:var(--gold-ink);letter-spacing:.04em}
.stop .meta{font-size:.8rem;color:var(--ink-soft);line-height:1.9;margin-top:auto}
.stop .meta b{color:var(--ink);font-weight:700;margin-right:.3em}
.badge{
  align-self:flex-start;
  font-size:.68rem;letter-spacing:.18em;font-weight:700;
  padding:.4rem .75rem;
}
.badge.bib{background:var(--red);color:#f6f1e5}
.badge.legacy{background:transparent;color:var(--red);border:1px solid var(--red)}
.stamp{
  position:absolute;top:1rem;right:1rem;width:72px;height:72px;z-index:2;
  color:var(--red);border:2px double var(--red);border-radius:50%;
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:.56rem;font-weight:800;letter-spacing:.1em;line-height:1.5;
  transform:rotate(8deg);background:rgba(168,30,34,.05);
  font-family:var(--serif-zh);opacity:.92;
}
.stop .right{padding:1.8rem 1.7rem;min-width:0}
.stop p{color:var(--ink-soft);font-size:.92rem}
.stop .tip{
  margin-top:1rem;padding:.75rem 1rem;border-left:3px solid var(--red);
  background:var(--paper-2);font-size:.85rem;
}
.stop .tip b{color:var(--red)}

/* ---------- dishes & map link ---------- */
.dishes{list-style:none;margin:.6rem 0 .9rem}
.dishes li{
  display:flex;justify-content:space-between;align-items:baseline;gap:1rem;
  border-bottom:1px dashed var(--rule);padding:.45rem 0;font-size:.92rem;
}
.dishes li b{font-family:var(--serif-zh);font-weight:700}
.dishes li .price{font-family:var(--display);color:var(--red);white-space:nowrap;font-size:.95rem}
.dishes li small{font-size:.72rem;color:var(--ink-soft);font-weight:400;font-family:var(--sans-zh)}
.maplink{
  display:inline-flex;align-items:center;gap:.45rem;
  font-size:.78rem;letter-spacing:.08em;color:var(--ink);
  border:1px solid var(--ink);padding:.5rem 1rem;
  text-decoration:none;transition:.2s;background:transparent;
}
.stop .right .maplink{margin-top:1.1rem}
.maplink:hover{background:var(--red);border-color:var(--red);color:#f6f1e5}
.stop .left .maplink{margin-top:.4rem}

/* ---------- compact cards ---------- */
.mini-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:1.2rem;margin-bottom:1.5rem}
.mini{
  position:relative;background:var(--paper);border:1px solid var(--ink);
  padding:1.3rem 1.2rem;display:flex;flex-direction:column;gap:.4rem;
}
.mini .top{display:flex;align-items:baseline;gap:.7rem;flex-wrap:wrap}
.mini .num{font-family:var(--display);color:var(--red);font-size:1.4rem}
.mini .zh{font-family:var(--serif-zh);font-weight:900;font-size:1.15rem}
.mini .en{font-family:var(--display);font-size:.78rem;color:var(--gold-ink);letter-spacing:.05em}
.mini .badge{margin-left:auto}
.mini .addr{font-size:.78rem;color:var(--ink-soft)}
.mini .hours{font-size:.75rem;color:var(--leaf)}
.mini .dishes{margin:.3rem 0 .4rem}
.mini .dishes li{padding:.3rem 0;font-size:.86rem}
.mini .maplink{margin-top:.5rem;align-self:flex-start}
.mini .note{font-size:.8rem;color:var(--ink-soft)}
.mini.legacy{background:var(--paper-2);border:1px dashed var(--gold-ink)}
.mini.legacy .num{color:var(--gold-ink)}
.mini.legacy .badge{color:var(--gold-ink);border-color:var(--gold-ink)}
.legacy-intro{color:var(--ink-soft);font-size:.85rem;max-width:52em;margin-bottom:1.4rem}

/* ---------- appendix: red section ---------- */
.tips{background:var(--red);color:#f6f1e5}
.tips .sec-head{border-top-color:#f6f1e5}
.tips .sec-num{color:var(--gold-lt)}
.tips .sec-title{color:#f6f1e5}
.tips .sec-title small{color:rgba(246,241,229,.7)}
.tips-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.3rem}
.tips .tip-card{border:1px solid rgba(246,241,229,.4);padding:1.4rem 1.3rem}
.tips .tip-card h3{
  font-family:var(--serif-zh);font-weight:700;font-size:1.02rem;color:#f6f1e5;
  margin-bottom:.5rem;display:flex;align-items:baseline;gap:.5rem;
}
.tips .tip-card h3 .ico{color:var(--gold-lt);font-family:var(--serif-zh)}
.tips .tip-card p{font-size:.85rem;color:rgba(246,241,229,.85)}

/* reveal: section heads only */
.reveal{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
.reveal.in{opacity:1;transform:none}

/* ---------- footer ---------- */
footer{
  padding:2.2rem clamp(1rem,4vw,3rem);
  background:var(--ink);color:#b7ac97;
  border-top:4px solid var(--red);font-size:.78rem;
}
footer .wrap{display:flex;gap:2rem;flex-wrap:wrap;justify-content:space-between}
footer b{color:#f6f1e5}

@media (max-width:820px){
  .stop{grid-template-columns:1fr}
  .stop .left{border-right:0;border-bottom:1px solid var(--ink);padding:1.5rem}
  nav .links{display:none}
  .hero .stats span{padding:.25rem .9rem}
}
@media (prefers-reduced-motion:reduce){
  .hero-frame>*{animation:none;opacity:1;transform:none}
  .reveal{opacity:1;transform:none;transition:none}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>

<nav>
  <div class="brand">MICHELIN<span class="zh">吉隆坡散步</span></div>
  <div class="links" id="nav-links"></div>
</nav>

<!-- ================= HERO: TITLE PAGE ================= -->
<header class="hero">
  <div class="hero-frame">
    <p class="kicker"></p>
    <h1></h1>
    <p class="sub"></p>
    <div class="stats" id="hero-stats"></div>
  </div>
</header>

<!-- 本卷收錄索引條 -->
<div class="dish-strip">
  <div class="wrap" id="dish-strip"></div>
</div>

<!-- 各區域與攻略由 app.js 依 data.js 渲染 -->
<main id="app"></main>

<footer id="foot"></footer>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
// 保險絲：若資料檔載入失敗（例如單檔預覽環境），顯示提示而不是白畫面
window.addEventListener('load', function(){
  if (typeof GUIDE === 'undefined') {
    document.getElementById('app').innerHTML =
      '<div style="padding:3rem;font-family:sans-serif;line-height:2">' +
      '<h2>⚠️ 資料檔未載入</h2>' +
      '<p>此頁面需要 index.html 與 data.js、app.js 三個檔案放在一起。</p>' +
      '<p>若在單檔預覽環境開啟，請改用 <b>index-standalone.html</b>（單一檔案版）。</p></div>';
  }
});
</script>
</body>
</html>
